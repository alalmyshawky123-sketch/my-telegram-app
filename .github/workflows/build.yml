name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip build-essential libffi-dev libssl-dev python3-dev openjdk-17-jdk
          pip install --upgrade pip
          pip install requests buildozer Cython==0.29.36

      - name: Initialize Buildozer
        run: |
          buildozer init || true

      - name: Build APK with Buildozer
        run: |
          # ضبط إعدادات buildozer.spec بشكل صحيح وآمن
          sed -i 's/#requirements = python3,requests/requirements = python3,requests/g' buildozer.spec
          sed -i 's/package.name = myapp/package.name = telegrammonitor/g' buildozer.spec
          sed -i 's/package.domain = org.example/package.domain = com.telebot/g' buildozer.spec
          sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec
          sed -i 's/android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec
          
          # تشغيل البناء بالطريقة الصحيحة دون استخدام أمر yes المسبب للخطأ
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: bin/*.apk
